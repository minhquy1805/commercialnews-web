name: Admin - Build Versioned Docker Image

on:
  push:
    tags:
      - "admin-v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Admin version tag, example: admin-v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ADMIN_IMAGE_NAME: minhquy1805/commercialnews-admin
  SOURCE_REPOSITORY_URL: https://github.com/minhquy1805/commercialnews-web
  IMAGE_AUTHOR: Nguyen Minh Quy

jobs:
  build-admin-image:
    name: Build Admin Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve admin version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$VERSION" =~ ^admin-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Version must match format admin-vX.Y.Z, example: admin-v1.0.0"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Resolved admin version: $VERSION"
          echo "Resolved short sha: $SHORT_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=CommercialNews Admin
            org.opencontainers.image.description=CommercialNews admin frontend
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY_URL }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.authors=${{ env.IMAGE_AUTHOR }}